services:
  # Backend Node.js Web Service
  - type: web
    name: ecart-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure random value
      - key: MONGODB_URI
        sync: false # You will paste your MongoDB Atlas URI in the Render Dashboard

  # Frontend Vite Static Site
  - type: web
    name: ecart-frontend
    runtime: static
    plan: free
    rootDir: frontend-react
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # You will paste your backend URL here
